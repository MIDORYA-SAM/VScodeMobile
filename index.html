<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KG Code — VS Code para iPhone/Chrome</title>
    <meta name="theme-color" content="#1e1e1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/microsoft/vscode/main/resources/win32/code.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/eclipse.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #181818; color: #cccccc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.2s, color 0.2s; }
        
        /* Tema Claro (Light Theme) */
        body.light-mode { background-color: #f3f3f3; color: #333333; }
        body.light-mode header { background-color: #f0f0f0; border-bottom: 1px solid #e0e0e0; }
        body.light-mode .logo { color: #005fb8; }
        body.light-mode #sidebar { background-color: #f8f8f8; border-right: 1px solid #e0e0e0; }
        body.light-mode .sidebar-title { color: #555; border-bottom: 1px solid #e5e5e5; }
        body.light-mode .file-item { color: #333; }
        body.light-mode .file-item.active { background-color: #e4e4e7; border-left-color: #007acc; color: #000; }
        body.light-mode .file-item i, body.light-mode .file-actions i { color: #666; }
        body.light-mode #editor-container { background: #ffffff; }
        body.light-mode .tabs-header { background-color: #f0f0f0; border-bottom: 1px solid #e0e0e0; }
        body.light-mode .tab { background: #e8e8e8; color: #666; border-right: 1px solid #ddd; }
        body.light-mode .tab.active { background: #ffffff; color: #000; border-top: 2px solid #007acc; }
        body.light-mode .quick-symbols { background: #f0f0f0; border-bottom: 1px solid #e0e0e0; }
        body.light-mode .symbol-btn { background: #e0e0e0; color: #333; border: 1px solid #ccc; }
        body.light-mode #bottom-panel { background: #f8f8f8; border-top: 1px solid #ddd; }
        body.light-mode .panel-tabs { background-color: #f0f0f0; border-bottom: 1px solid #ddd; }
        body.light-mode .panel-tab { color: #666; }
        body.light-mode .panel-tab.active { color: #000; border-bottom-color: #007acc; }
        body.light-mode #console-log { color: #007acc; }
        body.light-mode .modal-box { background: #ffffff; color: #333; border: 1px solid #ccc; }
        body.light-mode .modal-box h3 { color: #111; }
        body.light-mode .modal-box label { color: #555; }
        body.light-mode .modal-box input, body.light-mode .modal-box select { background: #f9f9f9; color: #333; border: 1px solid #ccc; }
        body.light-mode nav { background: #f0f0f0; border-top: 1px solid #ddd; }
        body.light-mode nav button { color: #555; }
        body.light-mode nav button.active { color: #007acc; }

        header { background-color: #323233; height: 45px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid #252526; }
        .logo { font-weight: bold; color: #007acc; display: flex; align-items: center; gap: 8px; font-size: 16px; }
        .actions { display: flex; gap: 6px; }
        .btn { background: #0e639c; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background: #3c3c3c; }
        .btn-success { background: #238636; }
        .btn-github { background: #24292e; border: 1px solid #444; }
        .btn-google { background: #db4437; color: white; }
        
        main { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        #sidebar { width: 220px; background-color: #252526; border-right: 1px solid #1e1e1e; display: flex; flex-direction: column; transition: transform 0.2s ease; z-index: 10; }
        #sidebar.hidden { display: none; }
        .sidebar-title { padding: 10px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #888; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d2d; }
        .sidebar-icons { display: flex; gap: 6px; }
        .file-list { flex: 1; overflow-y: auto; list-style: none; }
        .file-item { padding: 8px 12px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-left: 2px solid transparent; }
        .file-item.active { background-color: #37373d; border-left-color: #007acc; color: white; }
        .file-item i { margin-right: 8px; }
        .file-actions i { margin-left: 8px; color: #888; font-size: 12px; }
        
        #editor-container { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }
        .tabs-header { display: flex; background-color: #252526; overflow-x: auto; border-bottom: 1px solid #1e1e1e; }
        .tab { padding: 8px 16px; font-size: 12px; background: #2d2d2d; color: #969696; border-right: 1px solid #252526; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
        .tab.active { background: #1e1e1e; color: #ffffff; border-top: 2px solid #007acc; }
        
        .quick-symbols { display: flex; background: #2d2d2d; padding: 4px; gap: 4px; overflow-x: auto; border-bottom: 1px solid #1e1e1e; }
        .symbol-btn { background: #3c3c3c; color: #fff; border: none; padding: 4px 10px; border-radius: 3px; font-size: 13px; font-family: monospace; cursor: pointer; }
        .symbol-btn:active { background: #007acc; }

        .CodeMirror { height: 100% !important; font-family: 'Courier New', Courier, monospace; font-size: 14px; }
        
        #bottom-panel { height: 40%; background: #1e1e1e; border-top: 1px solid #333; display: flex; flex-direction: column; }
        #bottom-panel.hidden { display: none; }
        .panel-tabs { display: flex; background-color: #252526; border-bottom: 1px solid #2d2d2d; justify-content: space-between; }
        .panel-tab-group { display: flex; }
        .panel-tab { padding: 6px 12px; font-size: 12px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
        .panel-tab.active { color: white; border-bottom-color: #007acc; font-weight: bold; }
        .panel-content { flex: 1; overflow: auto; position: relative; }
        #preview-frame { width: 100%; height: 100%; border: none; background: white; }
        #console-log { padding: 10px; font-family: monospace; font-size: 12px; color: #4ec9b0; white-space: pre-wrap; }
        
        /* Modais */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: #252526; padding: 20px; border-radius: 6px; width: 90%; max-width: 400px; border: 1px solid #333; color: #ccc; }
        .modal-box h3 { margin-bottom: 12px; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 8px; }
        .modal-box label { font-size: 12px; display: block; margin-bottom: 4px; color: #aaa; }
        .modal-box input, .modal-box select { width: 100%; padding: 8px; background: #3c3c3c; color: #fff; border: 1px solid #555; border-radius: 4px; margin-bottom: 12px; font-size: 13px; }
        
        .status-bar { height: 22px; background: #007acc; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 11px; }

        nav { height: 40px; background: #252526; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; }
        nav button { background: none; border: none; color: #888; font-size: 16px; width: 100%; height: 100%; cursor: pointer; }
        nav button.active { color: #007acc; }
        nav button:active { background: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-code"></i> KG Code
        </div>
        <div class="actions">
            <button class="btn btn-secondary" onclick="formatCode()" title="Formatar Código"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
            <button class="btn btn-secondary" onclick="toggleModal('search-modal')" title="Localizar"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="btn btn-secondary" onclick="toggleModal('auth-modal')" title="Contas / Login"><i class="fa-solid fa-user-circle"></i></button>
            <button class="btn btn-success" onclick="runProject()" title="Executar"><i class="fa-solid fa-play"></i></button>
        </div>
    </header>

    <input type="file" id="file-input" style="display:none" multiple accept=".zip,.html,.css,.js,.py,.json,.md" onchange="handleFileImport(event)">

    <main>
        <div id="sidebar">
            <div class="sidebar-title">
                <span>Explorador</span>
                <div class="sidebar-icons">
                    <i class="fa-solid fa-file-circle-plus" onclick="addNewFile()" title="Novo Ficheiro" style="cursor:pointer"></i>
                    <i class="fa-solid fa-folder-arrow-down" onclick="document.getElementById('file-input').click()" title="Importar Ficheiro/ZIP" style="cursor:pointer"></i>
                    <i class="fa-solid fa-user-circle" onclick="toggleModal('auth-modal')" title="Login" style="cursor:pointer"></i>
                    <i class="fa-solid fa-gear" onclick="toggleModal('settings-modal')" title="Configurações" style="cursor:pointer"></i>
                </div>
            </div>
            <ul class="file-list" id="file-list"></ul>
        </div>

        <div id="editor-container">
            <div class="tabs-header" id="tabs-header"></div>
            
            <div class="quick-symbols">
                <button class="symbol-btn" onclick="insertSymbol('<')">&lt;</button>
                <button class="symbol-btn" onclick="insertSymbol('>')">&gt;</button>
                <button class="symbol-btn" onclick="insertSymbol('{')">{</button>
                <button class="symbol-btn" onclick="insertSymbol('}')">}</button>
                <button class="symbol-btn" onclick="insertSymbol('[')">[</button>
                <button class="symbol-btn" onclick="insertSymbol(']')">]</button>
                <button class="symbol-btn" onclick="insertSymbol('(')">(</button>
                <button class="symbol-btn" onclick="insertSymbol(')')">)</button>
                <button class="symbol-btn" onclick="insertSymbol('=')">=</button>
                <button class="symbol-btn" onclick="insertSymbol(';')">;</button>
                <button class="symbol-btn" onclick="insertSymbol('&quot;')">"</button>
                <button class="symbol-btn" onclick="insertSymbol('\'')">'</button>
                <button class="symbol-btn" onclick="insertSymbol('+')">+</button>
                <button class="symbol-btn" onclick="insertSymbol('-')">-</button>
            </div>

            <div style="flex: 1; position: relative;">
                <textarea id="code-editor"></textarea>
            </div>
        </div>
    </main>

    <div id="bottom-panel">
        <div class="panel-tabs">
            <div class="panel-tab-group">
                <div class="panel-tab active" onclick="switchPanel('preview')">Pré-visualização</div>
                <div class="panel-tab" onclick="switchPanel('console')">Console</div>
            </div>
            <div style="padding: 4px 10px;">
                <button class="btn btn-secondary" style="padding: 2px 6px; font-size: 10px;" onclick="openNewTab()"><i class="fa-solid fa-expand"></i> Nova Aba</button>
            </div>
        </div>
        <div class="panel-content" id="panel-preview">
            <iframe id="preview-frame"></iframe>
        </div>
        <div class="panel-content" id="panel-console" style="display: none;">
            <div id="console-log">> KG Code Console pronto.</div>
        </div>
    </div>

    <div class="status-bar">
        <div><i class="fa-solid fa-check-double"></i> <span id="save-status">Salvo</span></div>
        <div id="cursor-pos">Lin 1, Col 1</div>
        <div id="file-type-badge">HTML</div>
    </div>

    <!-- Modal de Login / Contas (Google & GitHub) -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-box">
            <h3><i class="fa-solid fa-user-lock"></i> Contas & Conexões</h3>
            
            <!-- Secção Google -->
            <div style="margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 12px;">
                <label style="font-weight: bold; color: #fff; margin-bottom: 6px;">Conta Google:</label>
                <div id="google-status" style="font-size: 12px; margin-bottom: 8px; color: #aaa;">Não conectado</div>
                <button class="btn btn-google" style="width: 100%; justify-content: center;" onclick="loginGoogle()"><i class="fa-brands fa-google"></i> Entrar com Google</button>
            </div>

            <!-- Secção GitHub -->
            <div>
                <label style="font-weight: bold; color: #fff; margin-bottom: 6px;">Conta GitHub (Repositórios):</label>
                <input type="password" id="github-token" placeholder="Personal Access Token (ghp_...)">
                <input type="text" id="github-user" placeholder="Usuário (ex: midorya-sam)">
                <input type="text" id="github-repo" placeholder="Repositório (ex: meu-projeto)">
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-github" style="flex:1; justify-content: center;" onclick="githubPull()"><i class="fa-solid fa-cloud-arrow-down"></i> Puxar</button>
                    <button class="btn btn-success" style="flex:1; justify-content: center;" onclick="githubPush()"><i class="fa-solid fa-cloud-arrow-up"></i> Enviar</button>
                </div>
            </div>

            <div style="text-align: right; margin-top: 15px;">
                <button class="btn btn-secondary" onclick="toggleModal('auth-modal')">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Localizar e Substituir -->
    <div class="modal-overlay" id="search-modal">
        <div class="modal-box">
            <h3><i class="fa-solid fa-magnifying-glass"></i> Localizar e Substituir</h3>
            <label>Localizar:</label>
            <input type="text" id="find-text" placeholder="Texto a procurar...">
            <label>Substituir por:</label>
            <input type="text" id="replace-text" placeholder="Novo texto...">
            <div style="display:flex; gap:8px; margin-top: 10px;">
                <button class="btn" style="flex:1" onclick="performReplace()">Substituir Tudo</button>
                <button class="btn btn-secondary" onclick="toggleModal('search-modal')">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Configurações (Com Tema Claro/Escuro) -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-box">
            <h3><i class="fa-solid fa-gear" style="color: #007acc;"></i> Configurações</h3>
            
            <label>Tema da Interface e Editor:</label>
            <select id="setting-theme" onchange="changeTheme()">
                <option value="dark">Escuro (Dracula)</option>
                <option value="light">Claro (Light)</option>
            </select>

            <label>Tamanho da Fonte:</label>
            <select id="setting-fontsize" onchange="changeFontSize()">
                <option value="12px">12px</option>
                <option value="14px" selected>14px (Padrão)</option>
                <option value="16px">16px</option>
                <option value="18px">18px</option>
            </select>

            <label>Quebra de Linha (Word Wrap):</label>
            <select id="setting-wrap" onchange="changeWordWrap()">
                <option value="false">Desligado</option>
                <option value="true">Ligado</option>
            </select>

            <div style="text-align: right; margin-top: 10px;">
                <button class="btn" onclick="toggleModal('settings-modal')">Fechar</button>
            </div>
        </div>
    </div>

    <nav>
        <button onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <button onclick="switchPanel('preview')"><i class="fa-solid fa-desktop"></i></button>
        <button onclick="switchPanel('console')"><i class="fa-solid fa-terminal"></i></button>
        <button onclick="toggleModal('auth-modal')"><i class="fa-solid fa-user-circle"></i></button>
        <button onclick="exportProject()"><i class="fa-solid fa-file-export"></i></button>
    </nav>

    <script>
        let files = JSON.parse(localStorage.getItem('kgcode_files')) || {
            'index.html': { name: 'index.html', language: 'htmlmixed', content: '<!DOCTYPE html>\n<html>\n<head>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>KG Code no iPhone/Chrome!</h1>\n  <button onclick="saudacao()">Testar JS</button>\n  <script src="script.js"><\/script>\n</body>\n</html>' },
            'style.css': { name: 'style.css', language: 'css', content: 'body {\n  font-family: sans-serif;\n  text-align: center;\n  padding-top: 40px;\n}\nbutton {\n  padding: 10px 20px;\n  background: #007acc;\n  color: white;\n  border: none;\n  border-radius: 5px;\n}' },
            'script.js': { name: 'script.js', language: 'javascript', content: 'function saudacao() {\n  alert("Tudo a funcionar perfeitamente!");\n  console.log("Executado com sucesso.");\n}' },
            'main.py': { name: 'main.py', language: 'python', content: 'print("Python rodando via WebAssembly!")\nfor i in range(3):\n    print(f"Passo {i+1}")' }
        };

        let currentFile = 'index.html';
        let editor;
        let pyodideInstance = null;

        window.onload = function() {
            editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
                lineNumbers: true,
                theme: "dracula",
                mode: "htmlmixed",
                viewportMargin: Infinity,
                inputStyle: "contenteditable",
                lineWrapping: false
            });

            editor.on("change", function() {
                if (currentFile && files[currentFile]) {
                    files[currentFile].content = editor.getValue();
                    saveLocal();
                    document.getElementById('save-status').innerText = 'A salvar...';
                    setTimeout(() => { document.getElementById('save-status').innerText = 'Salvo'; }, 500);
                }
            });

            editor.on("cursorActivity", function() {
                const pos = editor.getCursor();
                document.getElementById('cursor-pos').innerText = `Lin ${pos.line + 1}, Col ${pos.ch + 1}`;
            });

            // Carregar configurações guardadas
            const savedTheme = localStorage.getItem('kgcode_theme') || 'dark';
            document.getElementById('setting-theme').value = savedTheme;
            applyTheme(savedTheme);

            const savedSize = localStorage.getItem('kgcode_fontsize') || '14px';
            document.getElementById('setting-fontsize').value = savedSize;
            changeFontSize(savedSize);

            const savedWrap = localStorage.getItem('kgcode_wrap') === 'true';
            document.getElementById('setting-wrap').value = savedWrap;
            changeWordWrap(savedWrap);

            // Carregar credenciais GitHub e Google
            document.getElementById('github-token').value = localStorage.getItem('kgcode_gh_token') || '';
            document.getElementById('github-user').value = localStorage.getItem('kgcode_gh_user') || '';
            document.getElementById('github-repo').value = localStorage.getItem('kgcode_gh_repo') || '';

            const googleUser = localStorage.getItem('kgcode_google_user');
            if (googleUser) {
                document.getElementById('google-status').innerText = `Conectado como: ${googleUser}`;
            }

            renderFileList();
            openFile(currentFile);
        };

        function saveLocal() {
            localStorage.setItem('kgcode_files', JSON.stringify(files));
        }

        function renderFileList() {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            Object.keys(files).forEach(fileName => {
                const li = document.createElement('li');
                li.className = `file-item ${fileName === currentFile ? 'active' : ''}`;
                li.onclick = () => openFile(fileName);
                
                let icon = 'fa-file-code';
                if(fileName.endsWith('.html')) icon = 'fa-html5';
                if(fileName.endsWith('.css')) icon = 'fa-css3-alt';
                if(fileName.endsWith('.js')) icon = 'fa-js';
                if(fileName.endsWith('.py')) icon = 'fa-brands fa-python';

                li.innerHTML = `
                    <span><i class="${icon}"></i> ${fileName}</span>
                    <span class="file-actions">
                        <i class="fa-solid fa-trash" onclick="deleteFile(event, '${fileName}')"></i>
                    </span>
                `;
                list.appendChild(li);
            });

            renderTabs();
        }

        function renderTabs() {
            const tabs = document.getElementById('tabs-header');
            tabs.innerHTML = '';
            Object.keys(files).forEach(fileName => {
                const tab = document.createElement('div');
                tab.className = `tab ${fileName === currentFile ? 'active' : ''}`;
                tab.onclick = () => openFile(fileName);
                tab.innerHTML = `<span>${fileName}</span>`;
                tabs.appendChild(tab);
            });
        }

        function openFile(fileName) {
            currentFile = fileName;
            const file = files[fileName];
            editor.setOption("mode", file.language);
            editor.setValue(file.content);
            document.getElementById('file-type-badge').innerText = file.language.toUpperCase();
            renderFileList();
        }

        function insertSymbol(sym) {
            editor.replaceSelection(sym);
            editor.focus();
        }

        function addNewFile() {
            const name = prompt("Nome do Ficheiro (ex: index.html, style.css, script.js, main.py):");
            if (!name) return;

            let lang = 'htmlmixed';
            if (name.endsWith('.css')) lang = 'css';
            if (name.endsWith('.js')) lang = 'javascript';
            if (name.endsWith('.py')) lang = 'python';

            files[name] = { name: name, language: lang, content: '' };
            saveLocal();
            openFile(name);
        }

        function deleteFile(e, fileName) {
            e.stopPropagation();
            if (Object.keys(files).length <= 1) {
                alert("Deve manter pelo menos um ficheiro.");
                return;
            }
            if (confirm(`Deseja apagar ${fileName}?`)) {
                delete files[fileName];
                saveLocal();
                openFile(Object.keys(files)[0]);
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        function switchPanel(panelName) {
            document.getElementById('panel-preview').style.display = panelName === 'preview' ? 'block' : 'none';
            document.getElementById('panel-console').style.display = panelName === 'console' ? 'block' : 'none';
            document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function applyTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                editor.setOption('theme', 'eclipse');
            } else {
                document.body.classList.remove('light-mode');
                editor.setOption('theme', 'dracula');
            }
            localStorage.setItem('kgcode_theme', theme);
        }

        function changeTheme() {
            const theme = document.getElementById('setting-theme').value;
            applyTheme(theme);
        }

        function changeFontSize(sizeInput) {
            const size = sizeInput || document.getElementById('setting-fontsize').value;
            document.querySelector('.CodeMirror').style.fontSize = size;
            localStorage.setItem('kgcode_fontsize', size);
            editor.refresh();
        }

        function changeWordWrap(wrapInput) {
            const wrap = wrapInput !== undefined ? wrapInput : (document.getElementById('setting-wrap').value === 'true');
            editor.setOption("lineWrapping", wrap);
            localStorage.setItem('kgcode_wrap', wrap);
        }

        function formatCode() {
            const totalLines = editor.lineCount();
            for (let i = 0; i < totalLines; i++) {
                editor.indentLine(i);
            }
            alert("Código formatado com sucesso!");
        }

        function performReplace() {
            const findStr = document.getElementById('find-text').value;
            const replaceStr = document.getElementById('replace-text').value;
            if (!findStr) return;
            let content = editor.getValue();
            let newContent = content.replaceAll(findStr, replaceStr);
            editor.setValue(newContent);
            toggleModal('search-modal');
            alert("Substituição concluída!");
        }

        // Login Google Simulado / Integrado
        function loginGoogle() {
            const email = prompt("Insira o seu e-mail Google para autenticação rápida:");
            if (email) {
                localStorage.setItem('kgcode_google_user', email);
                document.getElementById('google-status').innerText = `Conectado como: ${email}`;
                alert("Login com Google efetuado com sucesso!");
            }
        }

        // GitHub Sync
        async function githubPush() {
            const token = document.getElementById('github-token').value.trim();
            const user = document.getElementById('github-user').value.trim();
            const repo = document.getElementById('github-repo').value.trim();

            if (!token || !user || !repo) {
                alert("Por favor, preencha o Token, Usuário e Repositório do GitHub.");
                return;
            }

            localStorage.setItem('kgcode_gh_token', token);
            localStorage.setItem('kgcode_gh_user', user);
            localStorage.setItem('kgcode_gh_repo', repo);

            const commitMsg = prompt("Mensagem do Commit:", "Atualização via KG Code");
            if (!commitMsg) return;

            alert("A enviar ficheiros para o GitHub...");

            try {
                for (let fileName of Object.keys(files)) {
                    const content = files[fileName].content;
                    const url = `https://api.github.com/repos/${user}/${repo}/contents/${fileName}`;
                    
                    let sha = "";
                    const checkRes = await fetch(url, {
                        headers: { "Authorization": `token ${token}` }
                    });
                    if (checkRes.ok) {
                        const data = await checkRes.json();
                        sha = data.sha;
                    }

                    const res = await fetch(url, {
                        method: "PUT",
                        headers: {
                            "Authorization": `token ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: commitMsg,
                            content: btoa(unescape(encodeURIComponent(content))),
                            sha: sha || undefined
                        })
                    });

                    if (!res.ok) throw new Error(`Erro ao enviar ${fileName}`);
                }
                alert("Commit realizado com sucesso!");
                toggleModal('auth-modal');
            } catch (err) {
                alert("Falha no commit: " + err.message);
            }
        }

        async function githubPull() {
            const token = document.getElementById('github-token').value.trim();
            const user = document.getElementById('github-user').value.trim();
            const repo = document.getElementById('github-repo').value.trim();

            if (!user || !repo) {
                alert("Preencha o Usuário e Repositório.");
                return;
            }

            try {
                const url = `https://api.github.com/repos/${user}/${repo}/contents/`;
                const headers = token ? { "Authorization": `token ${token}` } : {};
                const res = await fetch(url, { headers });

                if (!res.ok) throw new Error("Repositório não encontrado ou privado.");

                const data = await res.json();
                for (let item of data) {
                    if (item.type === "file") {
                        const fileRes = await fetch(item.download_url);
                        const text = await fileRes.text();
                        
                        let lang = 'htmlmixed';
                        if (item.name.endsWith('.css')) lang = 'css';
                        if (item.name.endsWith('.js')) lang = 'javascript';
                        if (item.name.endsWith('.py')) lang = 'python';

                        files[item.name] = { name: item.name, language: lang, content: text };
                    }
                }
                saveLocal();
                renderFileList();
                openFile(Object.keys(files)[0]);
                alert("Repositório descarregado com sucesso!");
                toggleModal('auth-modal');
            } catch (err) {
                alert("Erro ao puxar dados: " + err.message);
            }
        }

        async function runProject() {
            switchPanel('preview');
            
            if (currentFile.endsWith('.py')) {
                switchPanel('console');
                const logBox = document.getElementById('console-log');
                logBox.innerText = "> A carregar ambiente Python (Pyodide)...\n";
                try {
                    if (!pyodideInstance) {
                        pyodideInstance = await loadPyodide();
                    }
                    pyodideInstance.setStdout({ write: (str) => { logBox.innerText += str + "\n"; } });
                    await pyodideInstance.runPythonAsync(files[currentFile].content);
                } catch (err) {
                    logBox.innerText += `\n[ERRO PYTHON] ${err}`;
                }
                return;
            }

            const iframe = document.getElementById('preview-frame');
            let htmlContent = files['index.html'] ? files['index.html'].content : '';
            
            if (files['style.css']) {
                htmlContent = htmlContent.replace('</head>', `<style>${files['style.css'].content}</style></head>`);
            }

            const consoleInterceptor = `
                <script>
                    const _log = console.log;
                    console.log = function(...args) {
                        window.parent.postMessage({type: 'log', data: args.join(' ')}, '*');
                        _log.apply(console, args);
                    };
                    window.onerror = function(msg, url, line) {
                        window.parent.postMessage({type: 'error', data: msg + " (Linha " + line + ")" }, '*');
                    };
                <\/script>
            `;
            htmlContent = htmlContent.replace('<head>', '<head>' + consoleInterceptor);

            if (files['script.js']) {
                htmlContent = htmlContent.replace('</body>', `<script>${files['script.js'].content}<\/script></body>`);
            }

            iframe.srcdoc = htmlContent;
        }

        function openNewTab() {
            let htmlContent = files['index.html'] ? files['index.html'].content : '';
            if (files['style.css']) {
                htmlContent = htmlContent.replace('</head>', `<style>${files['style.css'].content}</style></head>`);
            }
            if (files['script.js']) {
                htmlContent = htmlContent.replace('</body>', `<script>${files['script.js'].content}<\/script></body>`);
            }
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        window.addEventListener('message', function(e) {
            if (e.data && e.data.type) {
                const logBox = document.getElementById('console-log');
                const line = document.createElement('div');
                line.style.color = e.data.type === 'error' ? '#f14c4c' : '#4ec9b0';
                line.textContent = `[${e.data.type.toUpperCase()}] ${e.data.data}`;
                logBox.appendChild(line);
            }
        });

        // Importação de arquivos e ZIP
        function handleFileImport(event) {
            const uploadedFiles = event.target.files;
            if (!uploadedFiles.length) return;

            Array.from(uploadedFiles).forEach(file => {
                if (file.name.endsWith('.zip')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        JSZip.loadAsync(e.target.result).then(function(zip) {
                            zip.forEach(function (relativePath, zipEntry) {
                                if (!zipEntry.dir) {
                                    zipEntry.async("string").then(function(content) {
                                        let lang = 'htmlmixed';
                                        if (relativePath.endsWith('.css')) lang = 'css';
                                        if (relativePath.endsWith('.js')) lang = 'javascript';
                                        if (relativePath.endsWith('.py')) lang = 'python';
                                        files[relativePath] = { name: relativePath, language: lang, content: content };
                                        saveLocal();
                                        renderFileList();
                                    });
                                }
                            });
                            alert("Projeto ZIP importado com sucesso!");
                        });
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        let name = file.name;
                        let lang = 'htmlmixed';
                        if (name.endsWith('.css')) lang = 'css';
                        if (name.endsWith('.js')) lang = 'javascript';
                        if (name.endsWith('.py')) lang = 'python';
                        files[name] = { name: name, language: lang, content: e.target.result };
                        saveLocal();
                        renderFileList();
                        openFile(name);
                    };
                    reader.readAsText(file);
                }
            });
            event.target.value = '';
        }

        function exportProject() {
            const zip = new JSZip();
            Object.keys(files).forEach(filename => {
                zip.file(filename, files[filename].content);
            });
            zip.generateAsync({type:"blob"}).then(function(content) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(content);
                a.download = "projeto-kgcode.zip";
                a.click();
            });
        }
    </script>
</body>
